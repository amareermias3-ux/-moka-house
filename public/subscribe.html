<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Coffee Club — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.wrap{width:min(760px,94vw)}
h1{font-family:Fraunces,serif;font-size:2rem;color:#e8b56b;text-align:center}
.sub{text-align:center;color:#c6b79e;margin-bottom:1.6rem}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.4rem}
.plan{background:#221a15;border:1.5px solid rgba(241,230,212,.13);border-radius:12px;padding:1.4rem;cursor:pointer;text-align:center}
.plan.sel{border-color:#d98e32;background:#281e17}
.price{font-family:Fraunces,serif;font-size:1.8rem;color:#d98e32}
.per{font-family:"Space Mono",monospace;font-size:.6rem;color:#93866f}
.plan ul{list-style:none;padding:0;margin:.8rem 0 0;color:#c6b79e;font-size:.8rem;text-align:left}
.plan li{padding:.2em 0}
form{background:#221a15;border:1px solid rgba(241,230,212,.13);border-radius:12px;padding:1.4rem}
input{width:100%;background:#171110;border:1.5px solid rgba(241,230,212,.28);border-radius:6px;padding:.8em 1em;color:#f1e6d4;font-family:"Space Mono",monospace;margin-bottom:.7rem}
.go{width:100%;background:#d98e32;color:#191008;border:none;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.msg{font-family:"Space Mono",monospace;font-size:.72rem;color:#8fa87e;margin-top:.6rem;text-align:center}
a{color:#d98e32}
</style>
</head>
<body>
<div class="wrap">
<h1>🔁 Coffee Club</h1>
<p class="sub">Fresh coffee, every month, automatically.</p>
<div class="plans" id="plans"></div>
<form id="sf">
  <input id="sName" placeholder="Your name" required>
  <input id="sEmail" type="email" placeholder="Your email" required>
  <button class="go">Join the Club ◆</button>
  <p class="msg" id="msg"></p>
</form>
<p style="text-align:center;margin-top:1.2rem"><a href="/">← Back to shop</a></p>
</div>
<script>
const PLANS=[
 {id:'Roast Club',price:25,f:['2 × 250g fresh-roast bags','Free delivery to any shop','Member-only roasts']},
 {id:'Daily Cup',price:40,f:['1 drink / day, any size','Priority queue','10% off beans']},
 {id:'Cupping Club',price:15,f:['Monthly cupping seat','Tasting notes journal','First access to rare lots']}
];
let sel='Roast Club';
function render(){document.getElementById('plans').innerHTML=PLANS.map(p=>`<div class="plan ${p.id===sel?'sel':''}" data-p="${p.id}"><div class="price">$${p.price}</div><div class="per">/month</div><b>${p.id}</b><ul>${p.f.map(x=>'<li>◆ '+x+'</li>').join('')}</ul></div>`).join('');}
render();
document.getElementById('plans').addEventListener('click',e=>{const c=e.target.closest('.plan');if(c){sel=c.dataset.p;render();}});
document.getElementById('sf').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:sName.value.trim(),email:sEmail.value.trim(),plan:sel})});
  const m=document.getElementById('msg');
  if(r.ok){m.textContent='🎉 Welcome to the club! We\'ll confirm soon.';e.target.reset();}
  else{m.style.color='#cf5636';m.textContent='Failed';}
});
</script>
</body>
</html>
