<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Coffee Club — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;padding:24px}
.wrap{max-width:900px;margin:0 auto}
h1{font-family:Fraunces,serif;font-size:2.2rem;color:#e8b56b}
.sub{color:#c6b79e}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem;margin:2rem 0}
.plan{background:#221a15;border:1.5px solid rgba(241,230,212,.13);border-radius:12px;padding:1.6rem;cursor:pointer;transition:.2s}
.plan:hover{border-color:#d98e32;transform:translateY(-4px)}
.plan.sel{border-color:#d98e32;background:#281e17;box-shadow:0 10px 30px -10px rgba(217,142,50,.4)}
.plan .price{font-family:Fraunces,serif;font-size:2rem;color:#d98e32}
.plan .per{font-family:"Space Mono",monospace;font-size:.66rem;color:#93866f}
.plan h3{font-family:Fraunces,serif;margin:.4rem 0}
.plan ul{list-style:none;padding:0;margin:.8rem 0 0;color:#c6b79e;font-size:.85rem}
.plan li{padding:.25em 0}
form{max-width:480px}
input{width:100%;background:#171110;border:1.5px solid rgba(241,230,212,.28);border-radius:6px;padding:.8em 1em;color:#f1e6d4;font-family:"Space Mono",monospace;margin-bottom:.8rem}
.go{width:100%;background:#d98e32;color:#191008;border:none;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.msg{font-family:"Space Mono",monospace;font-size:.72rem;color:#8fa87e;margin-top:.8rem}
a{color:#d98e32}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔁 Coffee Club</h1>
  <p class="sub">Fresh coffee, every month, automatically. Cancel anytime.</p>

  <div class="plans" id="plans"></div>

  <form id="subForm">
    <input id="sName" placeholder="Your name" required>
    <input id="sEmail" type="email" placeholder="Your email" required>
    <button class="go" id="go">Join the club</button>
    <p class="msg" id="msg"></p>
  </form>
  <p style="margin-top:1.4rem"><a href="/">← Back to shop</a></p>
</div>

<script>
const PLANS=[
 {id:'Roast Club',price:25,per:'/month',feat:['2 × 250g fresh-roast bags','Free delivery to any shop','Member-only roasts']},
 {id:'Daily Cup',price:40,per:'/month',feat:['1 drink / day, any size','Priority queue','10% off beans']},
 {id:'Cupping Club',price:15,per:'/month',feat:['Monthly cupping seat','Tasting notes journal','First access to rare lots']}
];
let sel=PLANS[0].id;
const $=s=>document.querySelector(s);
function render(){
  $('#plans').innerHTML=PLANS.map(p=>`
    <div class="plan ${p.id===sel?'sel':''}" data-p="${p.id}">
      <div class="price">$${p.price}<span class="per">${p.per}</span></div>
      <h3>${p.id}</h3>
      <ul>${p.feat.map(f=>`<li>◆ ${f}</li>`).join('')}</ul>
    </div>`).join('');
}
render();
$('#plans').addEventListener('click',e=>{const c=e.target.closest('.plan');if(!c)return;sel=c.dataset.p;render();});
$('#subForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('#sName').value.trim(),email=$('#sEmail').value.trim();
  if(!name||!email){$('#msg').textContent='Please fill name and email.';return;}
  const r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,plan:sel})});
  if(r.ok){$('#msg').textContent='🎉 Welcome to the club! We\'ll confirm your first delivery soon.';$('#sName').value='';$('#sEmail').value='';}
  else $('#msg').textContent='Could not subscribe.';
});
</script>
</body>
</html>
