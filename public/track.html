<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Track your order — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,94vw);background:#221a15;border:1px solid rgba(241,230,212,.28);border-radius:16px;padding:2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.em{font-size:2.6rem}
h1{font-family:Fraunces,serif;font-size:1.7rem;margin:.4rem 0 .2rem}
.sub{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:#d98e32;margin-bottom:1.4rem}
input{width:100%;background:#171110;border:1.5px solid rgba(241,230,212,.28);border-radius:6px;padding:.9em 1em;color:#f1e6d4;font-family:"Space Mono",monospace;font-size:1rem;text-transform:uppercase;margin-bottom:.8rem}
.go{width:100%;background:#d98e32;color:#191008;border:none;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.notify-btn{width:100%;margin-top:.6rem;background:none;border:1.5px solid #8fa87e;color:#8fa87e;font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.8em;border-radius:6px;cursor:pointer}
.notify-btn.on{background:#8fa87e;color:#191008}
.steps{display:flex;justify-content:space-between;margin:2rem 0 1rem;position:relative}
.steps::before{content:"";position:absolute;top:22px;left:8%;right:8%;height:2px;background:rgba(241,230,212,.15)}
.step{text-align:center;position:relative;z-index:1;flex:1}
.step .dot{width:44px;height:44px;border-radius:50%;border:2.5px solid rgba(241,230,212,.28);background:#171110;display:grid;place-items:center;margin:0 auto .5rem;font-size:1.1rem;transition:.3s}
.step.done .dot{background:#8fa87e;border-color:#8fa87e}
.step.now .dot{border-color:#d98e32;color:#d98e32;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(217,142,50,.18)}}
.step .lbl{font-family:"Space Mono",monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:#93866f}
.step.done .lbl{color:#8fa87e}.step.now .lbl{color:#d98e32}
.items{margin-top:1rem}
.it{display:flex;justify-content:space-between;padding:.4em 0;border-bottom:1px dashed rgba(241,230,212,.15);font-size:.88rem}
.total{display:flex;justify-content:space-between;margin-top:.8rem;font-family:"Space Mono",monospace}
.total b{color:#d98e32}
.err{font-family:"Space Mono",monospace;font-size:.72rem;color:#cf5636;margin-top:.8rem}
.ready-flash{animation:flash 1s ease 3}
@keyframes flash{50%{background:#8fa87e;color:#191008}}
.rowbtns{display:flex;gap:.6rem;margin-top:1.4rem}
.rbtn{flex:1;text-align:center;border-radius:6px;padding:.9em;font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.rcpt{background:#d98e32;color:#191008}
.shopb{background:none;border:1.5px solid rgba(241,230,212,.28);color:#93866f}
a{color:#d98e32}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="em">📦</div>
  <h1 data-i18n="t_title">Track your order</h1>
  <p class="sub">ERSCOMAS · Live status</p>
  <form id="tf">
    <input id="no" placeholder="MH-1234" required>
    <button class="go" data-i18n="t_go">Track ◆</button>
    <button type="button" class="notify-btn" id="notifyBtn">🔔 Enable ready alerts</button>
  </form>
  <p class="err" id="err" hidden></p>

  <div id="result" hidden>
    <div class="steps" id="steps"></div>
    <div class="items" id="items"></div>
    <div class="total"><span data-i18n="t_total">Total</span><b id="tot"></b></div>
    <div class="rowbtns">
      <a id="rcLink" class="rbtn rcpt" href="#">🧾 View receipt</a>
      <a class="rbtn shopb" href="/">← Shop</a>
    </div>
  </div>
  <p style="margin-top:1.4rem"><a href="/wait.html">🎮 Play while you wait · ተጫወት</a> · <a href="/">← Back to shop</a></p>
</div>

<script>
const $=s=>document.querySelector(s);
const ST=['queued','brewing','ready','picked-up'];
const ICON={queued:'⏳',brewing:'☕',ready:'✅','picked-up':'🎉'};
let LANG=localStorage.getItem('moka-lang')||'en';
let current=null,lastStatus=null,pollIv=null,alertsOn=false;

/* 🔔 notifications */
$('#notifyBtn').addEventListener('click',async()=>{
  if(!('Notification' in window)){alert('Notifications not supported');return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){alertsOn=true;$('#notifyBtn').classList.add('on');$('#notifyBtn').textContent='🔔 Alerts ON';new Notification('ERSCOMAS ☕',{body:'You\'ll be alerted when your order is ready!'});}
  else $('#notifyBtn').textContent='🔕 Blocked';
});
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,.2,.4].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880+i*220;g.gain.setValueAtTime(.2,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.3);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.3);});
  }catch(e){}
}
function notify(status){
  if(status==='ready'){
    beep();
    $('#card').classList.add('ready-flash');setTimeout(()=>$('#card').classList.remove('ready-flash'),3200);
    if(alertsOn&&'Notification' in window&&Notification.permission==='granted')new Notification('☕ Your order is READY!',{body:'Pick it up at the counter. Enjoy!'});
  }
}

/* render */
function render(o){
  $('#result').hidden=false;
  const idx=ST.indexOf(o.status);
  $('#steps').innerHTML=ST.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'now':''}"><div class="dot">${i<idx?'✓':ICON[s]||'•'}</div><div class="lbl">${s}</div></div>`).join('');
  $('#items').innerHTML=o.items.map(i=>`<div class="it"><span>${i.qty}× ${i.name}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('');
  $('#tot').textContent='$'+o.subtotal.toFixed(2);
  const rl=$('#rcLink');if(rl)rl.href='/receipt.html?no='+encodeURIComponent(o.no);
}

async function track(no){
  $('#err').hidden=true;
  try{
    const r=await fetch('/api/track/'+encodeURIComponent(no));
    if(!r.ok){$('#err').textContent='Order not found — check the number.';$('#err').hidden=false;$('#result').hidden=true;return;}
    const o=await r.json();
    current=o.no;
    if(lastStatus&&lastStatus!==o.status)notify(o.status);
    lastStatus=o.status;
    render(o);
  }catch(e){$('#err').textContent='Server unreachable';$('#err').hidden=false;}
}

$('#tf').addEventListener('submit',e=>{
  e.preventDefault();
  const no=$('#no').value.trim().toUpperCase();
  if(!no)return;
  localStorage.setItem('moka-last-order',no);
  track(no);
  clearInterval(pollIv);
  pollIv=setInterval(()=>track(no),5000);
});

/* auto-load last order */
(function(){
  const no=new URLSearchParams(location.search).get('no')||localStorage.getItem('moka-last-order');
  if(no){$('#no').value=no;track(no.toUpperCase());clearInterval(pollIv);pollIv=setInterval(()=>track(no.toUpperCase()),5000);}
})();
</script>
</body>
</html>
