<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the crew — Moka House</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#171110;--panel:#221a15;--line2:rgba(241,230,212,.28);--cream:#f1e6d4;--cream-mute:#93866f;--copper:#d98e32;--leaf:#8fa87e;--disp:"Fraunces",serif;--mono:"Space Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;background:var(--bg);background-image:radial-gradient(900px 500px at 30% -10%,rgba(143,168,126,.09),transparent 60%);color:var(--cream);font-family:"Space Grotesk",sans-serif;display:grid;place-items:center;padding:24px}
.lang-switch{position:fixed;top:14px;right:14px;z-index:200;background:#221a15;border:1.5px solid rgba(217,142,50,.6);border-radius:8px;padding:.35em .6em;font-family:var(--mono);font-size:.7rem;color:var(--copper);cursor:pointer}
[dir="rtl"] .lang-switch{right:auto;left:14px}
.gate{position:relative;width:min(460px,94vw)}
.door{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:2.2rem 2rem 1.8rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.door.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.mark{font-size:2rem;margin-bottom:.5rem}
h1{font-family:var(--disp);font-weight:900;font-size:1.7rem}
.sub{font-family:var(--mono);font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--leaf);margin:.4rem 0 1.5rem}
label{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-mute);margin-bottom:.9rem}
label span.lbl{display:block;margin-bottom:.35rem}
input,select{width:100%;background:var(--bg);border:1.5px solid var(--line2);border-radius:6px;padding:.75em 1em;color:var(--cream);font-family:var(--mono);font-size:.88rem;text-transform:none}
input:focus,select:focus{outline:none;border-color:var(--copper)}
.hint{font-family:var(--mono);font-size:.52rem;color:var(--cream-mute);margin-top:.3em;text-transform:none;letter-spacing:.06em;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.err{font-family:var(--mono);font-size:.7rem;color:#cf5636;margin:-.2rem 0 .9rem}
.gstatus{display:none;font-family:var(--mono);font-size:.66rem;line-height:1.7;color:#e8b56b;background:rgba(217,142,50,.08);border:1px dashed var(--copper);border-radius:6px;padding:.8em 1em;margin:.9rem 0}
.go{width:100%;background:var(--leaf);color:#191008;border:none;font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.go:hover{filter:brightness(1.12)}
.go[disabled]{opacity:.5}
.divider{display:flex;align-items:center;gap:1em;margin:1.1rem 0 .9rem;color:var(--cream-mute);font-family:var(--mono);font-size:.56rem;letter-spacing:.26em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line2)}
.gbtn{display:flex;justify-content:center;min-height:44px}
.alt{text-align:center;margin-top:1.1rem;font-size:.82rem;color:var(--cream-mute)}
.alt a{color:var(--copper);text-decoration:none;border-bottom:1px dashed var(--copper)}
.back-shop{display:inline-block;margin-top:1.1rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:var(--cream-mute);text-decoration:none}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<select class="lang-switch" id="langSwitch" aria-label="Language">
  <option value="am">አማርኛ</option><option value="en">English</option><option value="ar">العربية</option>
  <option value="fr">Français</option><option value="es">Español</option><option value="om">Afaan Oromoo</option>
  <option value="ti">ትግርኛ</option><option value="so">Soomaali</option>
</select>
<main style="display:grid;justify-items:center">
  <div class="gate">
    <div class="door" id="door">
      <div class="mark">🫘</div>
      <h1>JOIN THE CREW</h1>
      <p class="sub">Create your account · መለያ ፍር</p>
      <form id="regForm" autocomplete="off">
        <label><span class="lbl" data-i18n="full_name">Full name</span><input id="name" type="text" placeholder="Ermias Amare"></label>
        <label><span class="lbl" data-i18n="email_l">Email</span><input id="email" type="email" placeholder="you@example.com"></label>
        <div class="row2">
          <label><span class="lbl" data-i18n="phone_l">Phone number</span><input id="phone" type="tel" placeholder="+2519..."></label>
          <label><span class="lbl" data-i18n="gender">Gender (optional)</span>
            <select id="gender">
              <option value="">—</option>
              <option value="male" data-i18n="g_male">Male</option>
              <option value="female" data-i18n="g_female">Female</option>
              <option value="other" data-i18n="g_other">Other</option>
            </select>
          </label>
        </div>
        <label><span class="lbl" data-i18n="password">Password</span><input id="pass" type="password"><span class="hint">At least 6 characters</span></label>
        <label><span class="lbl" data-i18n="confirm_password">Confirm password</span><input id="pass2" type="password"></label>
        <p class="err" id="err" hidden></p>
        <button class="go" id="goBtn" type="submit" data-i18n="create_account">Create account ◆</button>
      </form>
      <div class="gstatus" id="gStatus"></div>
      <div class="divider" id="divider" hidden><span>or</span></div>
      <div class="gbtn" id="gBtn"></div>
      <p class="alt"><span data-i18n="already">Already have an account?</span> <a href="/login.html" data-i18n="login">Log in</a></p>
    </div>
  </div>
  <a class="back-shop" href="/" data-i18n="back_shop">← Back to the shop</a>
</main>
<script>
const $ = s => document.querySelector(s);
const REG_I18N={
en:{full_name:'Full name',email_l:'Email',phone_l:'Phone number',gender:'Gender (optional)',g_male:'Male',g_female:'Female',g_other:'Other'},
am:{full_name:'ሙሉ ስም',email_l:'ኢሜይል',phone_l:'ስልክ ቁጥር',gender:'ጾታ (አማራጭ)',g_male:'ተባዕላይ',g_female:'ሴት',g_other:'ሌላ'},
ar:{full_name:'الاسم الكامل',email_l:'البريد الإلكتروني',phone_l:'رقم الهاتف',gender:'الجنس (اختياري)',g_male:'ذكر',g_female:'أنثى',g_other:'آخر'},
fr:{full_name:'Nom complet',email_l:'E-mail',phone_l:'Téléphone',gender:'Genre (optionnel)',g_male:'Homme',g_female:'Femme',g_other:'Autre'},
es:{full_name:'Nombre completo',email_l:'Correo',phone_l:'Teléfono',gender:'Género (opcional)',g_male:'Hombre',g_female:'Mujer',g_other:'Otro'},
om:{full_name:'Maqaa guutuu',email_l:'Imeelii',phone_l:'Bilbila',gender:'Saala (filannoo)',g_male:'Dhala',g_female:'Dubra',g_other:'Kan biro'},
ti:{full_name:'ምሉእ ስም',email_l:'ኢመይል',phone_l:'ስልኪ',gender:'ጾታ (ኣማራጺ)',g_male:'ተባዕላይ',g_female:'ሰበይቲ',g_other:'ካልእ'},
so:{full_name:'Magaca oo dhan',email_l:'Iimayl',phone_l:'Telefoon',gender:'Jinsi (ikhtiyaari)',g_male:'Nin',g_female:'Dumar',g_other:'Kale'}
};
let LANG=localStorage.getItem('moka-lang')||'en';
function applyLang(lang){
  LANG=lang;localStorage.setItem('moka-lang',lang);
  const d=Object.assign({},(window.__I18N||{})[lang]||{},REG_I18N[lang]||{});
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=d[el.dataset.i18n];if(v!=null)el.textContent=v;});
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
  const sel=$('#langSwitch');if(sel)sel.value=lang;
}
$('#langSwitch').addEventListener('change',e=>applyLang(e.target.value));

function fail(msg){
  const door=$('#door'),err=$('#err');
  err.textContent=msg;err.hidden=false;
  door.classList.remove('shake');void door.offsetWidth;door.classList.add('shake');
}
$('#regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn=$('#goBtn');$('#err').hidden=true;
  const name=$('#name').value.trim(), email=$('#email').value.trim(), phone=$('#phone').value.trim(),
        gender=$('#gender').value, pass=$('#pass').value, pass2=$('#pass2').value;
  if(name.length<2)return fail('Full name required — ሙሉ ስምህን ጻፍ');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return fail('Valid email required — ትክለኛ ሜይል ጻፍ');
  if(phone && !/^\+?[0-9]{7,15}$/.test(phone.replace(/\s/g,'')))return fail('Valid phone required — ትክክለኛ ስልክ ቁጥር ጻፍ');
  if(pass.length<6)return fail('Password must be at least 6 characters');
  if(pass!==pass2)return fail('Passwords do not match — የይለፍ ቃላት አይመሳሰሉም');
  btn.disabled=true;btn.textContent='Creating…';
  try{
    const r=await fetch('/api/admin/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,email,phone,gender,pass})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.replace('/admin.html');return;}
    fail(d.error||'Registration failed');
  }catch(_){fail('Server unreachable');}
  btn.disabled=false;
});

async function onGoogle(response){
  try{
    const r=await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:response.credential})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.replace('/admin.html');return;}
    fail(d.error||'Google sign-in failed');
  }catch(_){fail('Server unreachable');}
}
function onGoogleError(e){let m='';try{m=e&&e.getMessage?e.getMessage():'blocked';}catch(_){m='blocked';}fail('Google error: '+m);}
(async function initGoogle(){
  let cfg;
  try{cfg=await fetch('/api/auth/google-config').then(r=>r.json());}catch(_){return;}
  if(!cfg.enabled)return;
  $('#divider').hidden=false;
  let tries=0;
  const tryRender=()=>{
    if(window.google&&google.accounts){
      try{
        google.accounts.id.initialize({client_id:cfg.clientId,callback:onGoogle,error_callback:onGoogleError});
        google.accounts.id.renderButton($('#gBtn'),{theme:'filled_black',size:'large',shape:'pill',text:'signup_with',width:380,logo_alignment:'center'});
      }catch(_){}
    }else if(tries++<40)setTimeout(tryRender,250);
  };
  tryRender();
})();
applyLang(LANG);
</script>
</body>
</html>
