<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the crew — Moka House</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#171110;--panel:#221a15;--line2:rgba(241,230,212,.28);--cream:#f1e6d4;--cream-mute:#93866f;--copper:#d98e32;--leaf:#8fa87e;--disp:"Fraunces",serif;--mono:"Space Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;background:var(--bg);background-image:radial-gradient(900px 500px at 30% -10%,rgba(143,168,126,.09),transparent 60%);color:var(--cream);font-family:"Space Grotesk",sans-serif;display:grid;place-items:center;padding:24px}
.lang-switch{position:fixed;top:14px;right:14px;z-index:200;background:#221a15;border:1.5px solid rgba(217,142,50,.6);border-radius:8px;padding:.35em .6em;font-family:var(--mono);font-size:.7rem;color:var(--copper);cursor:pointer}
[dir="rtl"] .lang-switch{right:auto;left:14px}
.gate{position:relative;width:min(420px,94vw)}
.door{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:2.4rem 2.1rem 2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.door.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.mark{font-size:2rem;margin-bottom:.5rem}
h1{font-family:var(--disp);font-weight:900;font-size:1.8rem}
.sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--leaf);margin:.4rem 0 1.7rem}
label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-mute);margin-bottom:1rem}
input{width:100%;margin-top:.4rem;background:var(--bg);border:1.5px solid var(--line2);border-radius:6px;padding:.8em 1em;color:var(--cream);font-family:var(--mono);font-size:.9rem}
input:focus{outline:none;border-color:var(--copper)}
.hint{font-family:var(--mono);font-size:.54rem;color:var(--cream-mute);margin-top:.35em;text-transform:none;letter-spacing:.06em}
.err{font-family:var(--mono);font-size:.7rem;color:#cf5636;margin:-.2rem 0 .9rem}
.gstatus{display:none;font-family:var(--mono);font-size:.66rem;line-height:1.7;color:#e8b56b;background:rgba(217,142,50,.08);border:1px dashed var(--copper);border-radius:6px;padding:.8em 1em;margin:.9rem 0}
.go{width:100%;background:var(--leaf);color:#191008;border:none;font-family:var(--mono);font-weight:700;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.go:hover{filter:brightness(1.12)}
.go[disabled]{opacity:.5}
.divider{display:flex;align-items:center;gap:1em;margin:1.2rem 0 1rem;color:var(--cream-mute);font-family:var(--mono);font-size:.56rem;letter-spacing:.26em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line2)}
.gbtn{display:flex;justify-content:center;min-height:44px}
.alt{text-align:center;margin-top:1.2rem;font-size:.82rem;color:var(--cream-mute)}
.alt a{color:var(--copper);text-decoration:none;border-bottom:1px dashed var(--copper)}
.back-shop{display:inline-block;margin-top:1.2rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:var(--cream-mute);text-decoration:none}
</style>
</head>
<body>
<select class="lang-switch" id="langSwitch" aria-label="Language">
  <option value="am">አማርኛ</option><option value="en">English</option><option value="ar">العربية</option>
  <option value="fr">Français</option><option value="es">Español</option><option value="om">Afaan Oromoo</option>
  <option value="ti">ትግርኛ</option><option value="so">Soomaali</option>
</select>
<main style="display:grid;justify-items:center">
  <div class="gate">
    <div class="door" id="door">
      <div class="mark">🫘</div>
      <h1>JOIN THE CREW</h1>
      <p class="sub">Staff account · አዲስ የሠራተኛ መለያ</p>
      <form id="regForm" autocomplete="off">
        <label data-i18n="username">Username<input id="user" type="text" spellcheck="false" autofocus><span class="hint">3–20 characters · letters, numbers, _ . -</span></label>
        <label data-i18n="password">Password<input id="pass" type="password"><span class="hint">At least 6 characters</span></label>
        <label data-i18n="confirm_password">Confirm password<input id="pass2" type="password"></label>
        <p class="err" id="err" hidden></p>
        <button class="go" id="goBtn" type="submit" data-i18n="create_account">Create account ◆</button>
      </form>
      <div class="gstatus" id="gStatus"></div>
      <div class="divider" id="divider" hidden><span>or</span></div>
      <div class="gbtn" id="gBtn"></div>
      <p class="alt"><span data-i18n="already">Already have an account?</span> <a href="/login.html" data-i18n="login">Log in</a></p>
    </div>
  </div>
  <a class="back-shop" href="/" data-i18n="back_shop">← Back to the shop</a>
</main>
<script>
const $ = s => document.querySelector(s);

/* ===== i18n ===== */
(function(){
  const dict = window.__I18N || {};
  let lang = localStorage.getItem('moka-lang') || 'en';
  if (!dict[lang]) lang = 'en';
  const sel = $('#langSwitch');
  if (sel) { sel.value = lang; sel.addEventListener('change', e => { localStorage.setItem('moka-lang', e.target.value); location.reload(); }); }
  const d = dict[lang] || {};
  document.querySelectorAll('[data-i18n]').forEach(el => { if (d[el.dataset.i18n]) el.textContent = d[el.dataset.i18n]; });
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
})();

function fail(msg) {
  const door = $('#door'), err = $('#err');
  err.textContent = msg; err.hidden = false;
  door.classList.remove('shake'); void door.offsetWidth; door.classList.add('shake');
}
function googleHelp(extra) {
  const s = $('#gStatus'); s.style.display = 'block';
  s.innerHTML = (extra ? '<b>' + extra + '</b><br>' : '') +
    'Google ችግር ከሆነ በ console.cloud.google.com ላይ፦<br>' +
    '1) OAuth consent screen → External → Test users ውስጥ Gmailህን ጨምር<br>' +
    '2) Credentials → Client ID → Authorized JavaScript origins → http://localhost:3000<br>' +
    '3) Save → 5 ደቂቃ ጠብ';
}
fetch('/api/admin/check').then(r => { if (r.ok) location.replace('/admin.html'); });

$('#regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#goBtn'); $('#err').hidden = true;
  const user = $('#user').value.trim(), pass = $('#pass').value, pass2 = $('#pass2').value;
  if (!/^[a-zA-Z0-9_.-]{3,20}$/.test(user)) return fail('Username: 3–20 letters, numbers, _ . -');
  if (pass.length < 6) return fail('Password must be at least 6 characters');
  if (pass !== pass2) return fail('Passwords do not match — የይለፍ ቃላት አይመሳሰሉም');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await fetch('/api/admin/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, pass }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.replace('/admin.html'); return; }
    fail(d.error || 'Registration failed');
  } catch (_) { fail('Server unreachable — is npm start running?'); }
  btn.disabled = false;
});

async function onGoogle(response) {
  try {
    const r = await fetch('/api/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: response.credential }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.replace('/admin.html'); return; }
    fail(d.error || 'Google sign-in failed'); googleHelp(d.error);
  } catch (_) { fail('Server unreachable'); googleHelp(); }
}
function onGoogleError(e) {
  let msg = '';
  try { msg = e && e.getMessage ? e.getMessage() : (e.type || 'blocked'); } catch (_) { msg = 'blocked'; }
  googleHelp('Google error: ' + msg);
}
(async function initGoogle() {
  const status = $('#gStatus');
  let cfg;
  try { cfg = await fetch('/api/auth/google-config').then(r => r.json()); }
  catch (_) { status.style.display = 'block'; status.textContent = '⚠️ Server unreachable'; return; }
  if (!cfg.enabled) { status.style.display = 'block'; status.textContent = '⚠️ Google not configured on server'; return; }
  $('#divider').hidden = false;
  let tries = 0;
  const tryRender = () => {
    if (window.google && google.accounts) {
      try {
        google.accounts.id.initialize({ client_id: cfg.clientId, callback: onGoogle, error_callback: onGoogleError });
        google.accounts.id.renderButton($('#gBtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signup_with', width: 330, logo_alignment: 'center' });
      } catch (_) { googleHelp('Button render failed'); }
    } else if (tries++ < 40) setTimeout(tryRender, 250);
    else googleHelp('⚠️ Google script failed to load — internet / ad-blocker?');
  };
  tryRender();
})();
</script>
</body>
</html>
