<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Find My Coffee — Moka House</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171110;--panel:#221a15;--line:rgba(241,230,212,.13);--line2:rgba(241,230,212,.28);--cream:#f1e6d4;--dim:#c6b79e;--mute:#93866f;--copper:#d98e32;--csoft:#e8b56b;--leaf:#8fa87e;--disp:"Fraunces",serif;--mono:"Space Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;background:var(--bg);background-image:radial-gradient(900px 500px at 70% -10%,rgba(217,142,50,.1),transparent 60%);color:var(--cream);font-family:"Space Grotesk",sans-serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}
.lang-switch{position:fixed;top:14px;right:14px;z-index:200;background:#221a15;border:1.5px solid rgba(217,142,50,.6);border-radius:8px;padding:.35em .6em;font-family:var(--mono);font-size:.7rem;color:var(--copper);cursor:pointer}
.home{position:fixed;top:14px;left:14px;z-index:200;background:#221a15;border:1.5px solid rgba(217,142,50,.6);border-radius:8px;padding:.35em .8em;font-family:var(--mono);font-size:.7rem;color:var(--copper);text-decoration:none}
.card{width:min(560px,94vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:2.2rem 2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);position:relative;overflow:hidden}
.beans{position:absolute;inset:0;pointer-events:none;opacity:.5}
.step-dots{display:flex;gap:.5rem;justify-content:center;margin-bottom:1.6rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line2);transition:.3s}
.dot.on{background:var(--copper);transform:scale(1.3)}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(1.6rem,5vw,2.4rem);text-align:center;margin-bottom:.4rem}
.sub{text-align:center;font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);margin-bottom:2rem}
.q{font-family:var(--disp);font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:1.6rem}
.opts{display:grid;gap:.8rem}
.opt{background:var(--bg);border:1.5px solid var(--line2);border-radius:10px;padding:1em 1.2em;color:var(--cream);font-family:var(--mono);font-size:.9rem;cursor:pointer;transition:.2s;display:flex;gap:.8em;align-items:center}
.opt:hover{border-color:var(--copper);transform:translateY(-2px)}
.opt .em{font-size:1.3rem}
.result{display:none;text-align:center}
.result.show{display:block;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.res-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--line2);margin-bottom:1.2rem;animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.res-name{font-family:var(--disp);font-size:1.8rem;font-weight:900;color:var(--csoft)}
.res-desc{color:var(--dim);font-size:.9rem;margin:.6rem 0}
.res-price{font-family:var(--mono);font-size:1.2rem;color:var(--copper);margin-bottom:1.4rem}
.btns{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:.9em 1.6em;border-radius:6px;cursor:pointer;transition:.2s;text-decoration:none}
.btn-solid{background:var(--copper);color:#191008;border:none;font-weight:700}
.btn-solid:hover{background:var(--csoft)}
.btn-ghost{background:none;border:1.5px solid var(--line2);color:var(--dim)}
.btn-ghost:hover{border-color:var(--copper);color:var(--cream)}
.confetti{position:fixed;top:-10px;font-size:1rem;pointer-events:none;animation:fall linear forwards;z-index:300}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--cream);color:#191008;font-family:var(--mono);font-size:.78rem;padding:.9em 1.4em;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:.3s;z-index:400}
.toast.show{opacity:1}
</style>
</head>
<body>
<a class="home" href="/">← <span data-i18n="home">Shop</span></a>
<select class="lang-switch" id="langSwitch">
  <option value="am">አማርኛ</option><option value="en">English</option><option value="ar">العربية</option>
  <option value="fr">Français</option><option value="es">Español</option><option value="om">Afaan Oromoo</option>
  <option value="ti">ትግርኛ</option><option value="so">Soomaali</option>
</select>

<div class="card">
  <div class="step-dots" id="dots"></div>
  <div id="quiz">
    <h1 data-i18n="q_title">Find My Coffee</h1>
    <p class="sub">Moka House · AI Taste Match</p>
    <p class="q" id="qText"></p>
    <div class="opts" id="opts"></div>
  </div>
  <div class="result" id="result">
    <img class="res-img" id="resImg" src="" alt="">
    <div class="res-name" id="resName"></div>
    <p class="res-desc" id="resDesc"></p>
    <div class="res-price" id="resPrice"></div>
    <div class="btns">
      <button class="btn btn-solid" id="addBtn" data-i18n="q_add">Add to tray +</button>
      <a class="btn btn-solid" href="/" data-i18n="q_checkout">Checkout ◆</a>
      <button class="btn btn-ghost" id="againBtn" data-i18n="q_again">↻ Again</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const QI18N={
en:{home:'Shop',q_title:'Find My Coffee',q_add:'Add to tray +',q_checkout:'Checkout ◆',q_again:'↻ Again',added:'Added to tray ✓',
q1:'How strong do you like it?',q1a:'Light & delicate',q1b:'Medium & balanced',q1c:'Strong & bold',
q2:'Milk?',q2a:'No milk',q2b:'A little',q2c:'Creamy & silky',
q3:'Temperature?',q3a:'Hot ☕',q3b:'Iced 🧊',
q4:'Sweetness?',q4a:'Not sweet',q4b:'Sweet 🍯'},
am:{home:'ሱቅ',q_title:'ቡናዬን ፈልግ',q_add:'ወደ መሸጫ +',q_checkout:'ክፍያ ◆',q_again:'↻ እንደገና',added:'ወደ መሸጫ ታክሏል ✓',
q1:'ምን ያህል ጠንካራ ፈልጋለህ?',q1a:'ቀል እና ስላ',q1b:'መካከለኛ',q1c:'ጠንካራ እና ጎልቶ',
q2:'ወተት?',q2a:'ያለ ወተት',q2b:'ትንሽ',q2c:'ክማማ',
q3:'ሙቀት?',q3a:'ትኩ ☕',q3b:'በረዶ 🧊',
q4:'ጣፋጭነት?',q4a:'ያለ ስኳር',q4b:'ጣጭ '},
ar:{home:'المتجر',q_title:'اعثر على قهوتك',q_add:'أضف للسلة +',q_checkout:'الدفع ◆',q_again:'↻ مجدداً',added:'أُضيف ✓',
q1:'ما قوتها؟',q1a:'خفيفة',q1b:'متوسطة',q1c:'قوية',
q2:'حليب؟',q2a:'بدون',q2b:'قليل',q2c:'كريمي',
q3:'الحرارة؟',q3a:'ساخنة ☕',q3b:'مثلجة 🧊',
q4:'الحلاوة؟',q4a:'بدون سكر',q4b:'حلوة 🍯'},
fr:{home:'Boutique',q_title:'Trouve mon café',q_add:'Ajouter +',q_checkout:'Payer ◆',q_again:'↻ Encore',added:'Ajouté ✓',
q1:'Quelle force?',q1a:'Léger',q1b:'Moyen',q1c:'Fort',
q2:'Lait?',q2a:'Sans',q2b:'Un peu',q2c:'Crémeux',
q3:'Température?',q3a:'Chaud ☕',q3b:'Glacé 🧊',
q4:'Sucré?',q4a:'Pas sucré',q4b:'Sucré 🍯'},
es:{home:'Tienda',q_title:'Encuentra tu café',q_add:'Añadir +',q_checkout:'Pagar ◆',q_again:'↻ Otra vez',added:'Añadido ✓',
q1:'¿Qué fuerza?',q1a:'Suave',q1b:'Medio',q1c:'Fuerte',
q2:'¿Leche?',q2a:'Sin',q2b:'Un poco',q2c:'Cremoso',
q3:'¿Temperatura?',q3a:'Caliente ☕',q3b:'Frío 🧊',
q4:'¿Dulce?',q4a:'Sin azúcar',q4b:'Dulce 🍯'},
om:{home:'Suqii',q_title:'Buna koo barbaadi',q_add:'Dabali +',q_checkout:'Kaffali ◆',q_again:'↻ Irra deebi\'i',added:'Dabalame ✓',
q1:'Hammam cimaa?',q1a:'Salphaa',q1b:'Giddu-galeessa',q1c:'Cimaa',
q2:'Aannan?',q2a:'Malee',q2b:'Xiqqoo',q2c:'Kiriimii',
q3:'Ho\'a?',q3a:'Ho\'aa ☕',q3b:'Qorra 🧊',
q4:'Mi\'a?',q4a:'Sukkaara malee',q4b:'Mi\'aa 🍯'},
ti:{home:'ዱን',q_title:'ቡነይ ድለ',q_add:'ወስኽ +',q_checkout:'ክፈል ◆',q_again:'↻ ከሊ',added:'ተወሲኹ ✓',
q1:'ክንደይ ይረ?',q1a:'ፈኪስ',q1b:'ማእከላይ',q1c:'ረን',
q2:'ባ?',q2a:'ዘይብሉ',q2b:'ውሑድ',q2c:'ክሪ',
q3:'ቐት?',q3a:'ውዑይ ☕',q3b:'ዝል 🧊',
q4:'ሽኮር?',q4a:'ዘይብሉ',q4b:'ሪር 🍯'},
so:{home:'Dukaan',q_title:'Hel kahwadayda',q_add:'Ku dar +',q_checkout:'Bixi ◆',q_again:'↻ Mar kale',added:'Lagu daray ✓',
q1:'Imisa adag?',q1a:'Fudud',q1b:'Dhexdhexaad',q1c:'Adag',
q2:'Caano?',q2a:'La\'aan',q2b:'Yar',q2c:'Kareem',
q3:'Kulayl?',q3a:'Kulul ☕',q3b:'Qabow 🧊',
q4:'Macaan?',q4a:'Sokor la\'aan',q4b:'Macaan 🍯'}
};
let LANG=localStorage.getItem('moka-lang')||'en';
const D=()=>QI18N[LANG]||QI18N.en;
function applyLang(){
  const d=D();
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=d[el.dataset.i18n];if(v)el.textContent=v;});
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
  $('#langSwitch').value=LANG;
  renderQ();
}
$('#langSwitch').addEventListener('change',e=>{LANG=e.target.value;localStorage.setItem('moka-lang',LANG);applyLang();});

/* taste profiles [strength, milk, hot, sweet] */
const PROFILE=[
 {name:'Espresso',v:[2,0,1,0],seed:'espresso-shot'},
 {name:'Macchiato',v:[2,1,1,1],seed:'macchiato-addis'},
 {name:'Honey Latte',v:[1,2,1,2],seed:'honey-latte'},
 {name:'Flat White',v:[2,2,1,0],seed:'flat-white-art'},
 {name:'Cappuccino',v:[2,2,1,0],seed:'cappuccino-foam'},
 {name:'Buna · Jebena',v:[2,0,1,0],seed:'jebena-buna'},
 {name:'V60 · Ethiopia Guji',v:[0,0,1,0],seed:'v60-pourover'},
 {name:'Chemex · Colombia',v:[0,0,1,0],seed:'chemex-brew'},
 {name:'Iced Macchiato',v:[2,1,0,1],seed:'iced-macchiato'},
 {name:'Iced Latte',v:[1,2,0,1],seed:'iced-latte-glass'},
 {name:'Cold Brew Tonic',v:[0,0,0,1],seed:'cold-brew-tonic'}
];
const QUESTIONS=[
 {key:'q1',opts:[{e:'🌱',k:'q1a',v:0},{e:'⚖️',k:'q1b',v:1},{e:'💪',k:'q1c',v:2}]},
 {key:'q2',opts:[{e:'🚫',k:'q2a',v:0},{e:'🥛',k:'q2b',v:1},{e:'🌫️',k:'q2c',v:2}]},
 {key:'q3',opts:[{e:'☕',k:'q3a',v:1},{e:'🧊',k:'q3b',v:0}]},
 {key:'q4',opts:[{e:'',k:'q4a',v:0},{e:'🍯',k:'q4b',v:2}]}
];
let step=0, ans=[];
let MENU=[];
fetch('/api/menu').then(r=>r.json()).then(m=>MENU=m).catch(()=>MENU=[]);

function renderDots(){
  $('#dots').innerHTML=QUESTIONS.map((_,i)=>`<div class="dot ${i<step?'on':''}"></div>`).join('');
}
function renderQ(){
  const d=D();
  if(step>=QUESTIONS.length){return showResult();}
  $('#quiz').style.display='block';$('#result').classList.remove('show');
  renderDots();
  const q=QUESTIONS[step];
  $('#qText').textContent=d[q.key];
  $('#opts').innerHTML=q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="em">${o.e}</span>${d[o.k]}</button>`).join('');
}
$('#opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  ans[step]=QUESTIONS[step].opts[+b.dataset.i].v;
  step++;
  renderQ();
});
function showResult(){
  renderDots();
  const target=[ans[0],ans[1],ans[2],ans[3]];
  let best=null,bd=1e9;
  for(const p of PROFILE){
    const d=p.v.reduce((s,v,i)=>s+Math.abs(v-target[i]),0);
    if(d<bd){bd=d;best=p;}
  }
  const live=MENU.find(m=>m.name===best.name)||MENU.find(m=>m.name.toLowerCase().includes(best.name.split('·')[0].trim().toLowerCase()))||{name:best.name,price:3.5,desc:'',seed:best.seed,id:null};
  $('#quiz').style.display='none';
  $('#result').classList.add('show');
  $('#resImg').src=`https://picsum.photos/seed/${live.seed||best.seed}/640/360`;
  $('#resName').textContent=live.name;
  $('#resDesc').textContent=live.desc||'★ '+ (D().q_title);
  $('#resPrice').textContent='$'+(live.price||3.5).toFixed(2);
  $('#addBtn').dataset.id=live.id||'';
  $('#addBtn').dataset.name=live.name;
  confetti();
}
$('#addBtn').addEventListener('click',e=>{
  const id=e.target.dataset.id, name=e.target.dataset.name;
  let cart={};try{cart=JSON.parse(localStorage.getItem('moka-cart'))||{}}catch(_){}
  if(id){cart[id]=(cart[id]||0)+1;}
  else{const m=MENU.find(x=>x.name===name);if(m)cart[m.id]=(cart[m.id]||0)+1;}
  localStorage.setItem('moka-cart',JSON.stringify(cart));
  toast(D().added);
});
$('#againBtn').addEventListener('click',()=>{step=0;ans=[];renderQ();});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function confetti(){
  const em=['☕','◆','✦',''];
  for(let i=0;i<24;i++){
    const c=document.createElement('div');
    c.className='confetti';c.textContent=em[i%4];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(1.5+Math.random()*1.5)+'s';
    c.style.color=['#d98e32','#e8b56b','#8fa87e'][i%3];
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3200);
  }
}
applyLang();
</script>
</body>
</html>
