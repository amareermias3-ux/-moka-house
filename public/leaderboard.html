<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>VIP Leaderboard — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,94vw);background:#221a15;border:1px solid rgba(241,230,212,.28);border-radius:16px;padding:2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
h1{font-family:Fraunces,serif;font-size:1.8rem;color:#e8b56b;text-align:center}
.sub{text-align:center;font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:#d98e32;margin:.2rem 0 1.4rem}
.row{display:flex;align-items:center;gap:.9rem;padding:.8rem .4rem;border-bottom:1px dashed rgba(241,230,212,.15)}
.rank{font-family:Fraunces,serif;font-weight:900;font-size:1.3rem;width:2.2rem;text-align:center;color:#93866f}
.row:nth-child(1) .rank{color:#ffd700}.row:nth-child(2) .rank{color:#c0c0c0}.row:nth-child(3) .rank{color:#cd7f32}
.who{flex:1}.who b{display:block}
.tier{font-family:"Space Mono",monospace;font-size:.62rem;color:#8fa87e}
.pts{font-family:"Space Mono",monospace;color:#e8b56b}
a{color:#d98e32}
</style>
</head>
<body>
<div class="card">
<h1>🏆 VIP Leaderboard</h1>
<p class="sub">Most loyal coffee lovers</p>
<div id="board">Loading…</div>
<p style="text-align:center;margin-top:1.2rem"><a href="/">← Back to shop</a></p>
</div>
<script>
(async()=>{
  try{
    const top=await fetch('/api/leaderboard').then(r=>r.json());
    const M=['🥇','','🥉'];
    document.getElementById('board').innerHTML=top.length?top.map((u,i)=>`<div class="row"><div class="rank">${M[i]||'#'+u.rank}</div><div class="who"><b>${u.name}</b><span class="tier">${u.tier}</span></div><div class="pts">${u.points} pts</div></div>`).join(''):'<p style="text-align:center;color:#93866f">No members yet — be the first!</p>';
  }catch(e){document.getElementById('board').textContent='Server unreachable.';}
})();
</script>
</body>
</html>
