<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Receipt — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.receipt{width:min(420px,94vw);background:#fdf8ef;color:#241a10;border-radius:6px;padding:2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);font-family:"Space Mono",monospace}
.brand{text-align:center;font-family:Fraunces,serif;font-weight:900;font-size:1.6rem}
.brand small{display:block;font-family:"Space Mono",monospace;font-size:.58rem;letter-spacing:.28em;color:#b3691e;margin-top:.2rem}
.dashed{border-top:2px dashed #c9bda9;margin:1.2rem 0}
.meta{font-size:.72rem;line-height:1.7}
.it{display:flex;justify-content:space-between;font-size:.8rem;padding:.3em 0}
.total{display:flex;justify-content:space-between;font-size:1rem;font-weight:700;margin-top:.6rem}
.status{text-align:center;margin-top:1rem;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
.status.ready{color:#3f7d34}.status.pending{color:#b3691e}
.thanks{text-align:center;font-size:.72rem;margin-top:1.2rem;color:#6b5d49}
.actions{display:flex;gap:.6rem;margin-top:1.4rem}
.btn{flex:1;text-align:center;font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.9em;border-radius:6px;cursor:pointer;text-decoration:none}
.print{background:#241a10;color:#fdf8ef;border:none}
.back{background:none;border:1.5px solid #c9bda9;color:#6b5d49}
@media print{
  body{background:#fff;padding:0}
  .actions{display:none}
  .receipt{box-shadow:none;width:100%}
}
</style>
</head>
<body>
<div class="receipt" id="rc">
  <div class="brand">MOKA HOUSE<small>ROASTERY · EST. 2016</small></div>
  <div class="dashed"></div>
  <div class="meta" id="meta">Loading…</div>
  <div class="dashed"></div>
  <div id="items"></div>
  <div class="total"><span>TOTAL</span><span id="tot"></span></div>
  <div class="status" id="st"></div>
  <div class="dashed"></div>
  <div class="thanks">◆ Thank you! · Built by ERMIAS AMARE · +251 976 021 007 ◆</div>
</div>
<div class="actions" style="width:min(420px,94vw)">
  <button class="btn print" onclick="window.print()">🖨 Print</button>
  <a class="btn back" href="/">← Shop</a>
</div>

<script>
(async()=>{
  const no=new URLSearchParams(location.search).get('no');
  if(!no){document.getElementById('meta').textContent='No order number.';return;}
  try{
    const r=await fetch('/api/track/'+encodeURIComponent(no.toUpperCase()));
    if(!r.ok){document.getElementById('meta').textContent='Order not found.';return;}
    const o=await r.json();
    document.getElementById('meta').innerHTML=
      `Order: <b>${o.no}</b><br>Date: ${new Date(o.created).toLocaleString()}<br>Pickup: ${o.pickup}`;
    document.getElementById('items').innerHTML=o.items.map(i=>`<div class="it"><span>${i.qty}× ${i.name}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('');
    document.getElementById('tot').textContent='$'+o.subtotal.toFixed(2);
    const st=document.getElementById('st');
    st.textContent='● '+o.status;
    st.className='status '+(o.status==='ready'?'ready':'pending');
  }catch(e){document.getElementById('meta').textContent='Server unreachable.';}
})();
</script>
</body>
</html>
