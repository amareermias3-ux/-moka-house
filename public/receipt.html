<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Receipt — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.receipt{width:min(420px,94vw);background:#fdf8ef;color:#241a10;border-radius:6px;padding:2rem;font-family:"Space Mono",monospace;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.brand{text-align:center;font-family:Fraunces,serif;font-weight:900;font-size:1.6rem}
.dashed{border-top:2px dashed #c9bda9;margin:1.2rem 0}
.it{display:flex;justify-content:space-between;font-size:.8rem;padding:.3em 0}
.total{display:flex;justify-content:space-between;font-size:1rem;font-weight:700;margin-top:.6rem}
.actions{display:flex;gap:.6rem;margin-top:1.4rem;width:min(420px,94vw)}
.actions a,.actions button{flex:1;text-align:center;padding:.9em;border-radius:6px;font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.print{background:#d98e32;color:#191008;border:none;font-weight:700}
.back{border:1.5px solid rgba(241,230,212,.28);color:#93866f}
@media print{.actions{display:none}.receipt{box-shadow:none}}
</style>
</head>
<body>
<div class="receipt">
  <div class="brand">MOKA HOUSE<small style="display:block;font-size:.55rem;letter-spacing:.28em;color:#b3691e">ROASTERY · EST. 2016</small></div>
  <div class="dashed"></div>
  <div id="meta" style="font-size:.72rem;line-height:1.7">Loading…</div>
  <div class="dashed"></div>
  <div id="items"></div>
  <div class="total"><span>TOTAL</span><span id="tot"></span></div>
  <div class="dashed"></div>
  <div style="text-align:center;font-size:.72rem;color:#6b5d49">◆ Thank you! · Built by ERMIAS AMARE ◆</div>
</div>
<div class="actions"><button class="print" onclick="window.print()">🖨 Print</button><a class="back" href="/">← Shop</a></div>
<script>
(async()=>{
  const no=new URLSearchParams(location.search).get('no');
  if(!no){document.getElementById('meta').textContent='No order number.';return;}
  try{
    const r=await fetch('/api/track/'+encodeURIComponent(no.toUpperCase()));
    if(!r.ok){document.getElementById('meta').textContent='Order not found.';return;}
    const o=await r.json();
    document.getElementById('meta').innerHTML=`Order: <b>${o.no}</b><br>Date: ${new Date(o.created).toLocaleString()}<br>Pickup: ${o.pickup}`;
    document.getElementById('items').innerHTML=o.items.map(i=>`<div class="it"><span>${i.qty}× ${i.name}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('');
    document.getElementById('tot').textContent='$'+o.subtotal.toFixed(2);
  }catch(e){document.getElementById('meta').textContent='Server unreachable.';}
})();
</script>
</body>
</html>
