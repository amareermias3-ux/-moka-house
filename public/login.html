<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Log in — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.card{width:min(440px,94vw);background:#221a15;border:1px solid rgba(241,230,212,.28);border-radius:16px;padding:2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
h1{font-family:Fraunces,serif;font-size:1.8rem;color:#e8b56b}
.sub{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:#d98e32;margin:.2rem 0 1.4rem}
label{display:block;font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#93866f;margin:.8rem 0 .3rem}
input{width:100%;background:#171110;border:1.5px solid rgba(241,230,212,.28);border-radius:6px;padding:.9em 1em;color:#f1e6d4;font-family:"Space Mono",monospace}
.go{width:100%;margin-top:1.2rem;background:#d98e32;color:#191008;border:none;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.or{text-align:center;color:#93866f;font-family:"Space Mono",monospace;font-size:.66rem;margin:1rem 0}
.g{width:100%;background:#fff;color:#241a10;border:none;border-radius:6px;padding:.9em;font-family:"Space Mono",monospace;font-weight:700;cursor:pointer}
.msg{font-family:"Space Mono",monospace;font-size:.72rem;margin-top:.8rem;color:#cf5636}
.links{display:flex;justify-content:space-between;margin-top:1.2rem;font-size:.8rem}
a{color:#d98e32}
</style>
</head>
<body>
<div class="card">
<h1>⚿ Log in</h1>
<p class="sub">ERSCOMAS · Members & Staff</p>
<form id="lf">
  <label>Username or email</label><input id="u" required>
  <label>Password</label><input id="p" type="password" required>
  <button class="go">Log in ◆</button>
  <p class="msg" id="msg"></p>
</form>
<div class="or">— OR —</div>
<button class="g" id="gbtn">G · Continue with Google</button>
<div class="links"><a href="/register.html">Create account</a><a href="/">← Shop</a></div>
</div>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
document.getElementById('lf').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u.value.trim(),pass:p.value})});
  const d=await r.json();
  if(r.ok){location.href='/admin.html';}
  else document.getElementById('msg').textContent=d.error||'Failed';
});
let googleReady=false;
fetch('/api/auth/google-config').then(r=>r.json()).then(c=>{
  if(c.enabled&&window.google){google.accounts.id.initialize({client_id:c.clientId,callback:async t=>{
    const r=await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:t.credential})});
    if(r.ok)location.href='/admin.html';
  }});googleReady=true;}
});
document.getElementById('gbtn').onclick=()=>{ if(googleReady)google.accounts.id.prompt(); else document.getElementById('msg').textContent='Google not configured'; };
</script>
</body>
</html>
