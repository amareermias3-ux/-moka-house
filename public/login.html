<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Log in — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171110;--panel:#221a15;--line:rgba(241,230,212,.28);--cream:#f1e6d4;--dim:#c6b79e;--mute:#93866f;--copper:#d98e32;--csoft:#e8b56b;--leaf:#8fa87e;--tomato:#cf5636;--disp:"Fraunces",serif;--mono:"Space Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;background:var(--bg);background-image:radial-gradient(900px 500px at 30% -10%,rgba(217,142,50,.1),transparent 60%);color:var(--cream);font-family:"Space Grotesk",sans-serif;display:grid;place-items:center;padding:24px}
.lang-switch{position:fixed;top:14px;right:14px;z-index:200;background:#221a15;border:1.5px solid rgba(217,142,50,.6);border-radius:8px;padding:.35em .6em;font-family:var(--mono);font-size:.7rem;color:var(--copper);cursor:pointer}
.home{position:fixed;top:14px;left:14px;z-index:200;background:#221a15;border:1.5px solid rgba(217,142,50,.6);border-radius:8px;padding:.35em .8em;font-family:var(--mono);font-size:.7rem;color:var(--copper);text-decoration:none}
.card{width:min(460px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:2.2rem 2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.em{font-size:2.6rem}
h1{font-family:var(--disp);font-size:1.7rem;margin:.5rem 0 .2rem}
.sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--copper);margin-bottom:1.6rem}
label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:.9rem}
label span{display:block;margin-bottom:.35rem}
input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:.8em 1em;color:var(--cream);font-family:var(--mono);font-size:.9rem}
input:focus{outline:none;border-color:var(--copper)}
.go{width:100%;background:var(--copper);color:#191008;border:none;font-family:var(--mono);font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer;margin-top:.3rem}
.go:hover{background:var(--csoft)}
.err{font-family:var(--mono);font-size:.7rem;color:var(--tomato);margin:.6rem 0}
.ok{font-family:var(--mono);font-size:.7rem;color:var(--leaf);margin:.6rem 0}
.links{display:flex;justify-content:space-between;margin-top:1.1rem;font-family:var(--mono);font-size:.68rem}
.links a{color:var(--copper);text-decoration:none}
.divider{display:flex;align-items:center;gap:.8rem;margin:1.2rem 0;color:var(--mute);font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
#forgotBox{display:none;margin-top:1.2rem;border-top:1px dashed var(--line);padding-top:1.2rem}
#forgotBox.show{display:block}
</style>
</head>
<body>
<a class="home" href="/">← <span data-i18n="back_shop">Shop</span></a>
<select class="lang-switch" id="langSwitch">
  <option value="am">አማርኛ</option><option value="en">English</option><option value="ar">العربية</option>
  <option value="fr">Français</option><option value="es">Español</option><option value="om">Afaan Oromoo</option>
  <option value="ti">ትግርኛ</option><option value="so">Soomaali</option>
</select>

<div class="card">
  <div class="em">⚿</div>
  <h1 data-i18n="login">Log in</h1>
  <p class="sub">ERSCOMAS · Staff & Members</p>

  <form id="loginForm">
    <label><span data-i18n="login_user">Username or email</span><input id="user" autocomplete="username" required></label>
    <label><span data-i18n="login_pass">Password</span><input id="pass" type="password" autocomplete="current-password" required></label>
    <button class="go" data-i18n="login">Log in</button>
  </form>
  <p class="err" id="err" hidden></p>

  <div class="links">
    <a href="/register.html" data-i18n="register">Register</a>
    <a href="#" id="forgotToggle" data-i18n="forgot">Forgot password?</a>
  </div>

  <div id="forgotBox">
    <p style="font-family:var(--mono);font-size:.66rem;color:var(--dim);margin-bottom:.8rem" data-i18n="forgot_note">Enter your username + the email & phone you registered with, then a new password.</p>
    <label><span data-i18n="login_user">Username or email</span><input id="fUser"></label>
    <label><span>Email</span><input id="fEmail" type="email"></label>
    <label><span data-i18n="reg_phone">Phone</span><input id="fPhone" type="tel"></label>
    <label><span data-i18n="new_pass">New password</span><input id="fNew" type="password"></label>
    <button class="go" id="forgotGo" data-i18n="reset">Reset password</button>
    <p class="err" id="fErr" hidden></p>
    <p class="ok" id="fOk" hidden></p>
  </div>

  <div class="divider">or</div>
  <div id="googleBtn"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const LI18N={
en:{login:'Log in',login_user:'Username or email',login_pass:'Password',register:'Register',forgot:'Forgot password?',forgot_note:'Enter your username + the email & phone you registered with, then a new password.',new_pass:'New password',reset:'Reset password',back_shop:'Shop',reset_ok:'Password changed! Log in with your new password.'},
am:{login:'ግባ',login_user:'ተጠቃሚ ም ወይም ኢሜይል',login_pass:'የይለፍ ል',register:'ተመዝገብ',forgot:'የይለፍ ቃል ረሳህ?',forgot_note:'ተጠቃሚ ስም + የተመዘገበውን ኢሜይል እና ስልክ ባ፣ ከያ አዲስ የይለፍ ል።',new_pass:'አዲስ የይለፍ ል',reset:'የይለፍ ቃል ቀይር',back_shop:'ሱ',reset_ok:'የይለፍ ል ተቀይሯል! በአዲሱ ባ'},
ar:{login:'دخول',login_user:'اسم المستخدم أو البريد',login_pass:'كلمة المرور',register:'تسجيل',forgot:'نسيت كلمة المرور؟',forgot_note:'أدخل اسم المستخدم + البريد والهاتف المسجل، ثم كلمة مرور جديدة.',new_pass:'كلمة مرور جديدة',reset:'تغيير كلمة المرور',back_shop:'المتجر',reset_ok:'تم التغيير! ادخل بكلمة المرور الجديدة.'},
fr:{login:'Connexion',login_user:'Nom ou e-mail',login_pass:'Mot de passe',register:'S\'inscrire',forgot:'Mot de passe oublié?',forgot_note:'Nom + e-mail & téléphone enregistrés, puis nouveau mot de passe.',new_pass:'Nouveau mot de passe',reset:'Réinitialiser',back_shop:'Boutique',reset_ok:'Modifié! Connectez-vous.'},
es:{login:'Entrar',login_user:'Usuario o correo',login_pass:'Contraseña',register:'Registrarse',forgot:'¿Olvidaste la contraseña?',forgot_note:'Usuario + correo y teléfono registrados, luego nueva contraseña.',new_pass:'Nueva contraseña',reset:'Cambiar',back_shop:'Tienda',reset_ok:'¡Cambiada! Entra.'},
om:{login:'Seeni',login_user:'Maqaa ykn imeelii',login_pass:'Jecha darbii',register:'Galmaa\'i',forgot:'Jecha darbii irraanfatte?',forgot_note:'Maqaa + imeelii & bilbila galmaa\'e, itti ansisee jecha haaraa.',new_pass:'Jecha haaraa',reset:'Jijjiiri',back_shop:'Suqii',reset_ok:'Jijjiirame! Seeni.'},
ti:{login:'እቶ',login_user:'ስም ወይ ኢመይል',login_pass:'ፓስዎርድ',register:'ተመዝገብ',forgot:'ፓስዎርድ ረሲዕካ?',forgot_note:'ስም + ኢመይል & ስልኪ ጽሓፍ፡ ሓድሽ ፓስዎርድ።',new_pass:'ሓድሽ ፓስዎርድ',reset:'ቀይር',back_shop:'ዱኳን',reset_ok:'ተቀይሩ! እቶ።'},
so:{login:'Soo gal',login_user:'Magac ama iimayl',login_pass:'Furaha',register:'Is diiwaan geli',forgot:'Furaha ilaawday?',forgot_note:'Magac + iimayl & telefoon diiwaangashan, kadib fur cusub.',new_pass:'Fur cusub',reset:'Beddel',back_shop:'Dukaan',reset_ok:'Waa la beddelay! Soo gal.'}
};
let LANG=localStorage.getItem('moka-lang')||'en';
window.__I18N=window.__I18N||{};
function D(){return Object.assign({},window.__I18N[LANG]||{},LI18N[LANG]||{});}
function applyLang(){
  const d=D();
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=d[el.dataset.i18n];if(v)el.textContent=v;});
  document.documentElement.lang=LANG;document.documentElement.dir=(LANG==='ar')?'rtl':'ltr';
  $('#langSwitch').value=LANG;
}
(async()=>{try{const l=await fetch('/api/i18n').then(r=>r.json());for(const k of l){if(!window.__I18N[k])window.__I18N[k]=await fetch('/api/i18n/'+k).then(r=>r.json());}}catch(e){}applyLang();})();
$('#langSwitch').addEventListener('change',e=>{LANG=e.target.value;localStorage.setItem('moka-lang',LANG);applyLang();});

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('#err').hidden=true;
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('#user').value,pass:$('#pass').value})});
    const d=await r.json();
    if(r.ok){location.href=(d.role==='customer')?'/':'/admin.html';}
    else{$('#err').textContent=d.error;$('#err').hidden=false;}
  }catch(_){$('#err').textContent='Server unreachable';$('#err').hidden=false;}
});

$('#forgotToggle').addEventListener('click',e=>{e.preventDefault();$('#forgotBox').classList.toggle('show');});
$('#forgotGo').addEventListener('click',async()=>{
  $('#fErr').hidden=true;$('#fOk').hidden=true;
  try{
    const r=await fetch('/api/forgot/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('#fUser').value,email:$('#fEmail').value,phone:$('#fPhone').value,newpass:$('#fNew').value})});
    const d=await r.json();
    if(r.ok){$('#fOk').textContent=D().reset_ok;$('#fOk').hidden=false;}
    else{$('#fErr').textContent=d.error;$('#fErr').hidden=false;}
  }catch(_){$('#fErr').textContent='Server unreachable';$('#fErr').hidden=false;}
});

/* Google */
(async()=>{
  try{
    const cfg=await fetch('/api/auth/google-config').then(r=>r.json());
    if(!cfg.enabled)return;
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
    s.onload=()=>{google.accounts.id.initialize({client_id:cfg.clientId,callback:async({credential})=>{
      const r=await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential})});
      const d=await r.json(); if(r.ok)location.href=(d.role==='customer')?'/':'/admin.html'; else{$('#err').textContent=d.error;$('#err').hidden=false;}
    }});google.accounts.id.renderButton($('#googleBtn'),{theme:'filled_blue',size:'large'});};
    document.head.appendChild(s);
  }catch(e){}
})();
</script>
</body>
</html>
