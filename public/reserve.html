<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Reserve a Table — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,94vw);background:#221a15;border:1px solid rgba(241,230,212,.28);border-radius:16px;padding:2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
h1{font-family:Fraunces,serif;font-size:1.8rem;color:#e8b56b}
.sub{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:#d98e32;margin:.2rem 0 1.4rem}
label{display:block;font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#93866f;margin:.8rem 0 .3rem}
input,select{width:100%;background:#171110;border:1.5px solid rgba(241,230,212,.28);border-radius:6px;padding:.8em 1em;color:#f1e6d4;font-family:"Space Mono",monospace;font-size:.9rem}
.row{display:flex;gap:.8rem}.row>div{flex:1}
.go{width:100%;margin-top:1.2rem;background:#d98e32;color:#191008;border:none;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.msg{font-family:"Space Mono",monospace;font-size:.72rem;margin-top:.8rem;color:#8fa87e}
a{color:#d98e32}
</style>
</head>
<body>
<div class="card">
  <h1>🪑 Reserve a Table</h1>
  <p class="sub">ERSCOMAS · Book your seat</p>
  <form id="rf">
    <label>Name</label><input id="rName" required>
    <label>Phone</label><input id="rPhone" type="tel" placeholder="+251..." required>
    <div class="row">
      <div><label>Date</label><input id="rDate" type="date" required></div>
      <div><label>Time</label><input id="rTime" type="time" required></div>
    </div>
    <div class="row">
      <div><label>People</label><input id="rPeople" type="number" min="1" max="12" value="2"></div>
      <div><label>Shop</label><select id="rShop"><option>Old Harbor</option><option>Riverside</option><option>Museum Quarter</option></select></div>
    </div>
    <button class="go" type="submit">Reserve ◆</button>
    <p class="msg" id="msg"></p>
  </form>
  <p style="margin-top:1.2rem"><a href="/">← Back to shop</a></p>
</div>
<script>
document.getElementById('rf').addEventListener('submit',async e=>{
  e.preventDefault();
  const body={name:rName.value.trim(),phone:rPhone.value.trim(),date:rDate.value,time:rTime.value,people:rPeople.value,shop:rShop.value};
  const r=await fetch('/api/reserve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(r.ok){msg.textContent='✅ Reserved! We\'ll confirm shortly. ጠረዛ ተይዟል!';e.target.reset();}
  else{msg.style.color='#cf5636';msg.textContent=d.error||'Failed';}
});
</script>
</body>
</html>
