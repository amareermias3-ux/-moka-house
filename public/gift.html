<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Gift Cards — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,94vw);background:#221a15;border:1px solid rgba(241,230,212,.28);border-radius:16px;padding:2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);text-align:center}
h1{font-family:Fraunces,serif;font-size:1.8rem;color:#e8b56b}
.sub{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:#d98e32;margin:.2rem 0 1.4rem}
.amts{display:flex;gap:.6rem;justify-content:center;margin:1rem 0}
.amt{padding:.8em 1.4em;border:1.5px solid rgba(241,230,212,.28);border-radius:8px;background:none;color:#c6b79e;cursor:pointer;font-family:"Space Mono",monospace}
.amt.sel{background:#d98e32;border-color:#d98e32;color:#191008;font-weight:700}
select{width:100%;background:#171110;border:1.5px solid rgba(241,230,212,.28);border-radius:6px;padding:.8em 1em;color:#f1e6d4;font-family:"Space Mono",monospace}
.go{width:100%;margin-top:1rem;background:#d98e32;color:#191008;border:none;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.code{margin:1.2rem auto;padding:1em;border:2px dashed #d98e32;border-radius:8px;font-family:"Space Mono",monospace;font-size:1.2rem;letter-spacing:.2em;color:#e8b56b;display:none}
.msg{font-family:"Space Mono",monospace;font-size:.72rem;color:#8fa87e;margin-top:.6rem}
a{color:#d98e32}
</style>
</head>
<body>
<div class="card">
<h1>🎁 Gift a Coffee</h1>
<p class="sub">ERSCOMAS · Gift Cards</p>
<div class="amts">
  <button class="amt sel" data-a="10">$10</button>
  <button class="amt" data-a="25">$25</button>
  <button class="amt" data-a="50">$50</button>
</div>
<select id="method"><option value="telebirr">Telebirr</option><option value="mpesa">M-Pesa</option><option value="paypal">PayPal</option><option value="card">Card</option></select>
<button class="go" id="buy">Buy Gift Card ◆</button>
<div class="code" id="code"></div>
<p class="msg" id="msg"></p>
<p style="margin-top:1.2rem"><a href="/">← Back to shop</a></p>
</div>
<script>
let amt=10;
document.querySelectorAll('.amt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.amt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');amt=+b.dataset.a;});
document.getElementById('buy').onclick=async()=>{
  const r=await fetch('/api/giftcard/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:amt,method:document.getElementById('method').value,buyer:'guest'})});
  const d=await r.json();
  const m=document.getElementById('msg');
  if(r.ok){const c=document.getElementById('code');c.style.display='block';c.textContent=d.code;m.textContent='✅ Share this code — redeem at checkout!';}
  else{m.style.color='#cf5636';m.textContent=d.error||'Failed';}
};
</script>
</body>
</html>
