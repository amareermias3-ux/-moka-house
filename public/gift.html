<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#171110">
<title>Gift Cards — ERSCOMAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#171110;color:#f1e6d4;font-family:"Space Grotesk",sans-serif;display:grid;place-items:center;min-height:100svh;padding:24px}
.card{width:min(460px,94vw);background:#221a15;border:1px solid rgba(241,230,212,.28);border-radius:16px;padding:2rem;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
h1{font-family:Fraunces,serif;font-size:1.7rem;color:#e8b56b}
.sub{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:#d98e32;margin:.3rem 0 1.4rem}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem}
.amt{border:1.5px solid rgba(241,230,212,.28);border-radius:8px;background:none;color:#f1e6d4;font-family:"Space Mono",monospace;padding:.8em 0;cursor:pointer}
.amt.sel{background:#d98e32;color:#191008;border-color:#d98e32;font-weight:700}
select,input{width:100%;background:#171110;border:1.5px solid rgba(241,230,212,.28);border-radius:6px;padding:.8em 1em;color:#f1e6d4;font-family:"Space Mono",monospace;margin-bottom:.8rem}
.go{width:100%;background:#d98e32;color:#191008;border:none;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1em;border-radius:6px;cursor:pointer}
.code{display:none;margin-top:1.2rem;background:#8fa87e;color:#191008;border-radius:10px;padding:1.2rem;text-align:center;font-family:"Space Mono",monospace}
.code b{font-size:1.4rem;letter-spacing:.2em;display:block;margin-top:.4rem}
a{color:#d98e32}
</style>
</head>
<body>
<div class="card">
  <h1>🎁 Gift Cards</h1>
  <p class="sub">ERSCOMAS · Give the gift of coffee</p>
  <div class="amts" id="amts"></div>
  <select id="method">
    <option value="telebirr">Telebirr</option><option value="mpesa">M-Pesa</option><option value="paypal">PayPal</option>
    <option value="card">Card</option><option value="bank">Bank</option><option value="crypto">Crypto</option>
  </select>
  <input id="buyer" placeholder="Your name / email (optional)">
  <button class="go" id="buy">Buy gift card</button>
  <div class="code" id="codeBox">🎉 Your gift code:<b id="codeVal"></b><small>Share it — redeem at checkout.</small></div>
  <p style="margin-top:1rem;font-family:'Space Mono',monospace;font-size:.66rem"><a href="/">← Back to shop</a></p>
</div>
<script>
let amt=10;
const A=[5,10,20,50];
$('#amts').innerHTML=A.map(v=>`<button class="amt ${v===amt?'sel':''}" data-v="${v}">$${v}</button>`).join('');
$('#amts').addEventListener('click',e=>{const b=e.target.closest('.amt');if(!b)return;amt=+b.dataset.v;$$('#amts .amt').forEach(x=>x.classList.toggle('sel',+x.dataset.v===amt));});
function $$(s){return[...document.querySelectorAll(s)];}
$('#buy').addEventListener('click',async()=>{
  const r=await fetch('/api/giftcard/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:amt,method:$('#method').value,buyer:$('#buyer').value})});
  const d=await r.json();
  if(r.ok){$('#codeBox').style.display='block';$('#codeVal').textContent=d.code;}
  else alert(d.error);
});
</script>
</body>
</html>
